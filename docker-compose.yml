version: '3.8'

services:
  backend:
    build: ./backend
    hostname: backend
    ports:
      - "8000:8000"
    networks:
      - my_network
  frontend:
    build: ./frontend
    hostname: frontend
    environment:
      - BACKEND_URL=http://backend:8000/api
    ports:
      - "3000:3000"
    networks:
      - my_network
    depends_on:
      - backend

networks:
  my_network: {}